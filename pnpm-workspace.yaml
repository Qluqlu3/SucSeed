# packages フィールド: pnpm 9 のワークスペース必須フィールド
#   '.'   = Rails に同梱している既存のフロント（frontend/）
#   'web' = 移行先の Next.js アプリ
#   'packages/*' = 両方から使う共有パッケージ（packages/api = /api/v1 の型とクライアント）
packages:
  - '.'
  - 'web'
  - 'packages/*'

# allowBuilds: pnpm 11 のビルドスクリプト承認設定（pnpm 9 は無視する）
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
