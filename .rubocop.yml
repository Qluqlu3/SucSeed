# rubocop 1.72 以降は拡張を require ではなく plugins で読み込む
plugins:
  - rubocop-rails
  - rubocop-performance

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'db/schema.rb'
    - 'db/migrate/**/*'
    - 'bin/**/*'
    - 'vendor/**/*'
    - 'node_modules/**/*'
    - 'config/boot.rb'
    - 'config/environment.rb'

# ── Layout ────────────────────────────────────────────────────────────────────

# frontend の biome.json (lineWidth: 100) に合わせる。
# controllers の AR クエリチェーンと db/seeds の説明文（日本語の長文）は対象外
Layout/LineLength:
  Max: 100
  AllowedPatterns:
    - '\A\s*#'
  Exclude:
    - 'app/controllers/**/*'
    - 'app/uploaders/**/*'
    - 'db/seeds/**/*'

# ── Metrics ───────────────────────────────────────────────────────────────────
# 既存のファットコントローラに合わせて緩和 (将来の Service 化で絞る予定)

Metrics/MethodLength:
  Max: 50

Metrics/ClassLength:
  Max: 250

# 既存のファットコントローラが超過。Service 化完了後に 50 へ戻す予定
Metrics/AbcSize:
  Max: 100

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/PerceivedComplexity:
  Max: 15

Metrics/BlockLength:
  Max: 50
  Exclude:
    - 'config/routes.rb'

# find_by_password_reset_token は has_secure_password が、
# find_by_email_verification_token は User が明示的に定義した実メソッドで、
# ActiveRecord の動的ファインダではない。
Rails/DynamicFindBy:
  AllowedMethods:
    - find_by_password_reset_token
    - find_by_email_verification_token

# Rails 8.0 で追加された params.expect を強制する。
# require(:x).permit(...) は params[:x] が Hash 以外(?user=foo など)のときに
# 500 になるが、expect は ParameterMissing を投げて 400 で返せる。
Rails/StrongParametersExpect:
  Enabled: true

# ── Style ─────────────────────────────────────────────────────────────────────

# クラス/モジュール doc コメントは必須にしない
Style/Documentation:
  Enabled: false

# frozen_string_literal マジックコメントは任意
Style/FrozenStringLiteralComment:
  Enabled: false

# 既存コードはシングルクォート主体（biome.json の quoteStyle: single と揃える）
Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: single_quotes

# biome.json の trailingCommas: all と揃え、複数行の引数/配列/ハッシュには
# 末尾カンマを付ける（要素追加時の diff を1行に抑えるため）
Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma

# ── Rails ─────────────────────────────────────────────────────────────────────

Rails/FilePath:
  EnforcedStyle: slashes

# update_all / update_column は意図的に使用
# (is_ok・is_add_list など boolean の一括更新、login_time の記録)
Rails/SkipsModelValidations:
  Exclude:
    - 'app/controllers/match_controller.rb'
    - 'app/controllers/admin_edit_controller.rb'
    - 'app/controllers/message_controller.rb'
    - 'app/controllers/user_controller.rb'
    - 'app/controllers/api/v1/message_threads_controller.rb'
    - 'app/controllers/api/v1/session_controller.rb'
    - 'app/models/concerns/soft_deletable.rb'
    - 'app/models/user.rb'
    - 'test/**/*'

# Flash メッセージの i18n 化は別タスクで対応予定
Rails/I18nLocaleTexts:
  Enabled: false

# DB index の有無は schema で管理 (model 側 cop は誤検知が多い)
Rails/UniqueValidationWithoutIndex:
  Enabled: false

# inverse_of は Rails が自動推論できるケースが多い
Rails/InverseOf:
  Enabled: false

# art_categories / inquiry_categories はマスタデータで dependent 不要
Rails/HasManyOrHasOneDependent:
  Enabled: false

# render_404 / get_history はルーティングで参照済みのメソッド名
Naming/VariableNumber:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

# DiaryFeedPresenter は引数 6 個が適切 (キーワード引数でラベル明確)
Metrics/ParameterLists:
  Max: 6

# Rack::Attack の公式記法は compact style (class Rack::Attack)
Style/ClassAndModuleChildren:
  Exclude:
    - 'config/initializers/rack_attack.rb'
