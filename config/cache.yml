# 本アプリは MySQL インスタンス1個のシンプルな構成（config/database.yml は
# production で単一の DATABASE_URL のみ）。Solid Cache のインストーラ既定である
# 別データベース/別接続(database: cache)を使うと、本番で新しい接続文字列と
# DBプロビジョニングが必要になり運用が複雑になるだけなので、あえて
# `database:` を指定しない。
# その場合 ActiveRecord::Base の接続プールをそのまま使う(gem README の
# "If none of these are set, Solid Cache will use the ActiveRecord::Base
# connection pool" を参照)。solid_cache_entries テーブルは主DBに同居する。
default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
